<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Better Playwriter options</title></head>
<body><main>
  <h1>Auto-connect tabs</h1>
  <p>Enter one HTTP or HTTPS mask per line. Use a trailing * to match any path on an origin
    (<code>http://example.test*</code>) or a path prefix (<code>http://example.test/app/*</code>).
    Clear the list to stop auto-connecting. Disconnecting a tab pauses auto-connect for that tab.</p>
  <form id="auto-attach">
    <p><label for="masks">URL masks</label><br><textarea id="masks" rows="6" cols="48" spellcheck="false" autocomplete="off"></textarea></p>
    <p><label><input id="remember" type="checkbox" checked> Remember sites I connect manually</label></p>
    <button id="save-masks" type="submit" disabled>Save</button><output id="masks-status" aria-live="polite"></output>
  </form>
</main><script type="module" src="./profile-options.ts"></script></body></html>
