name: Build Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
    outputs:
      filename:
        value: ${{ jobs.build.outputs.filename }}
      version:
        value: ${{ jobs.build.outputs.version }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the release commit and CLI package
        if: inputs.release-tag != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          CLI_VERSION=$(node -p 'require("./playwriter/package.json").version')
          CLI_STORE_ID=$(node -p 'require("./playwriter/package.json").betterPlaywriter?.storeId ?? ""')
          test "$(node -p 'require("./playwriter/package.json").name')" = better-playwriter
          [[ "$CLI_STORE_ID" =~ ^[a-p]{32}$ ]]
          REGISTRY=https://registry.npmjs.org
          test "$(npm view "better-playwriter@$CLI_VERSION" version --registry "$REGISTRY")" = "$CLI_VERSION"
          test "$(npm view "better-playwriter@$CLI_VERSION" betterPlaywriter.storeId --registry "$REGISTRY")" = "$CLI_STORE_ID"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: pnpm bootstrap
      - name: Package the Chrome extension
        id: package
        env:
          CWS_RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/package-extension.mjs
      - name: Install headless Chromium
        run: node playwright/packages/playwright-core/cli.js install --with-deps chromium
      - name: Smoke-test the exact store ZIP
        env:
          ZIP: ${{ steps.package.outputs.filename }}
          VERSION: ${{ steps.package.outputs.version }}
        run: node scripts/smoke-store-extension.mjs "$ZIP" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-zip
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true
